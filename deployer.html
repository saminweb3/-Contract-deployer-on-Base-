<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deploy Smart Contract to Base</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0b0e17;
      color: #d0d8ff;
      margin: 0;
      padding: 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      background: #141a2e;
      padding: 2rem;
      border-radius: 14px;
      border: 1px solid #2a3566;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    }
    h1 {
      text-align: center;
      color: #8b5cf6;
      margin-bottom: 1.6rem;
    }
    label {
      display: block;
      margin: 1.2rem 0 0.5rem;
      font-weight: 600;
      color: #a0b0ff;
    }
    textarea {
      width: 100%;
      min-height: 260px;
      padding: 14px;
      background: #0f1325;
      border: 1px solid #3a4570;
      border-radius: 10px;
      color: #e0e8ff;
      font-family: 'Courier New', monospace;
      font-size: 0.96rem;
      resize: vertical;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      background: #0f1325;
      border: 1px solid #3a4570;
      border-radius: 10px;
      color: #e0e8ff;
    }
    button {
      width: 100%;
      padding: 16px;
      margin: 1.4rem 0 0.8rem;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }
    #connectBtn {
      background: #3b82f6;
    }
    #connectBtn:hover:not(:disabled) {
      background: #60a5fa;
    }
    #deployBtn {
      background: linear-gradient(90deg, #7c3aed, #ec4899);
    }
    #deployBtn:hover:not(:disabled) {
      background: linear-gradient(90deg, #9f7aea, #f472b6);
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    #status {
      margin-top: 1.5rem;
      padding: 14px;
      border-radius: 10px;
      background: #1c2342;
      min-height: 80px;
      white-space: pre-wrap;
      font-size: 0.98rem;
    }
    .success { background: #14532d; color: #bbf7d0; }
    .error   { background: #431d1d; color: #fca5a5; }
    a { color: #a5b4fc; text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <h1>Deploy Contract to Base Mainnet</h1>

  <label for="solidityCode">Solidity Contract Code (full source):</label>
  <textarea id="solidityCode" placeholder="// SPDX-License-Identifier: MIT
pragma solidity ^0.8.24;

contract MyContract {
    string public greeting = 'Hello Base!';
    
    constructor(string memory _greeting) {
        greeting = _greeting;
    }
}"></textarea>

  <label for="constructorArgs">Constructor arguments (comma separated, strings in quotes):</label>
  <input type="text" id="constructorArgs" placeholder='"My NFT Collection", "MNC"' value="">

  <button id="connectBtn">Connect MetaMask</button>
  <button id="deployBtn" disabled>Deploy to Base</button>

  <div id="status">Status messages will appear here...</div>
</div>

<script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
<script>
// ────────────────────────────────────────────────
const statusEl     = document.getElementById('status');
const codeArea     = document.getElementById('solidityCode');
const argsInput    = document.getElementById('constructorArgs');
const connectBtn   = document.getElementById('connectBtn');
const deployBtn    = document.getElementById('deployBtn');

let provider, signer, account;

const BASE_CHAIN_ID     = 8453;
const BASE_RPC          = "https://mainnet.base.org";
const BASE_EXPLORER     = "https://basescan.org/tx/";

async function updateStatus(msg, type = "") {
  statusEl.textContent = msg;
  statusEl.className = type;
}

// ─── 1. Connect Wallet ──────────────────────────────────
connectBtn.onclick = async () => {
  if (!window.ethereum) {
    updateStatus("MetaMask / wallet not found", "error");
    return;
  }

  try {
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    provider = new ethers.providers.Web3Provider(window.ethereum);
    signer   = provider.getSigner();
    account  = await signer.getAddress();

    const network = await provider.getNetwork();
    const chainId = network.chainId;

    connectBtn.textContent = `Connected: ${account.slice(0,6)}...${account.slice(-4)}`;
    connectBtn.disabled = true;

    if (chainId !== BASE_CHAIN_ID) {
      try {
        await window.ethereum.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: '0x' + BASE_CHAIN_ID.toString(16) }],
        });
        updateStatus(`Switched to Base (chainId ${BASE_CHAIN_ID})\nAccount: ${account}`, "success");
      } catch (switchErr) {
        if (switchErr.code === 4902) {
          await window.ethereum.request({
            method: 'wallet_addEthereumChain',
            params: [{
              chainId: '0x2105',
              chainName: 'Base Mainnet',
              nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
              rpcUrls: [BASE_RPC],
              blockExplorerUrls: [BASE_EXPLORER.replace('/tx/', '')]
            }]
          });
          updateStatus("Base network added & switched", "success");
        } else {
          throw switchErr;
        }
      }
    } else {
      updateStatus(`Connected to Base • ${account}`, "success");
    }

    deployBtn.disabled = false;
  } catch (err) {
    updateStatus("Connection failed\n" + (err.message || err), "error");
  }
};

// ─── 2. Deploy ──────────────────────────────────────────
deployBtn.onclick = async () => {
  const code = codeArea.value.trim();
  if (!code) {
    updateStatus("Please paste contract code", "error");
    return;
  }

  deployBtn.disabled = true;
  updateStatus("Compiling & deploying... (do not close page)");

  try {
    // Very basic constructor args parsing – supports strings & numbers
    let constructorArgs = [];
    const argsStr = argsInput.value.trim();
    if (argsStr) {
      // Very naive split – improve for production (use ABI encoder)
      constructorArgs = argsStr.split(',').map(s => {
        s = s.trim();
        if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) {
          return s.slice(1, -1);
        }
        if (!isNaN(s)) return Number(s);
        return s; // fallback
      });
    }

    // Compile (ethers does not compile → we assume user gives bytecode + ABI or use solc-js)
    // For simplicity we use ethers ContractFactory with ABI + bytecode
    // But most users will need to compile first. Here we show minimal version.

    updateStatus("This page expects **already compiled** bytecode + ABI.\nFor real usage compile in Remix → copy ABI & Bytecode.\n\nDemo placeholder: deploying minimal contract...");

    // ────────────── PASTE YOUR COMPILED ABI + BYTECODE HERE ─────────────────────
    // Example – replace with your own from Remix / Hardhat
    const abi = [
      "constructor(string greeting)",
      "function greeting() view returns (string)"
    ];
    const bytecode = "0x608060405234801561001057600080fd5b5060405161021e38038061021e83398181016040526020810190506100329161004e565b806000908051906020019061004b9291906100d8565b5050610156565b6000604051905090565b600080fd5b6000819050919050565b61007881610065565b811461008357600080fd5b50565b6000815190506100958161006f565b92915050565b6000602082840312156100b1576100b0610060565b5b60006100bf84828501610086565b91505092915050565b600081905092915050565b82818337600083830152505050565b60006100f0826100c8565b6100fa81856100d3565b935061010a8185602086016100cd565b80840191505092915050565b6000610122826100c8565b61012c81856100d3565b93508360208202850161013e85610065565b8060005b8581101561017f5784601f8401602083018561015a856100c8565b610163886100d3565b945061016d8582856100dd565b9350505b6020820191508401826040019050610142565b50929795505050505050565b6000600282049050919050565b7f4e487b7100000000000000000000000000000000000000000000000000000000600052603260045260246000fd5b60006101c182610065565b91506101cc83610065565b9250828210156101dc576101db610189565b5b92915050565b60006101ee826100c8565b6101f881856100d3565b93506102088185602086016100cd565b80840191505092915050565b600061021f610221565b9050919050565b6020810190565b61023c81610065565b811461024757600080fd5b50565b600061025461024f565b905061025f8282610233565b91508190509291505056fea2646970667358221220..."; // truncated – get real bytecode from Remix

    const factory = new ethers.ContractFactory(abi, bytecode, signer);

    updateStatus("Deploying...\nConstructor args: " + JSON.stringify(constructorArgs));

    const contract = await factory.deploy(...constructorArgs, {
      gasLimit: 5500000,
      // gasPrice: await signer.getGasPrice() // optional
    });

    updateStatus(`Transaction sent!\nHash: ${contract.deployTransaction.hash}\nWaiting for confirmation...`);

    const receipt = await contract.deployTransaction.wait();

    const addr = receipt.contractAddress;

    updateStatus(
      `Contract deployed!\n\nAddress: ${addr}\n\n` +
      `View on Basescan:\nhttps://basescan.org/address/${addr}\n\n` +
      `Tx: ${BASE_EXPLORER}${contract.deployTransaction.hash}`,
      "success"
    );

  } catch (err) {
    updateStatus("Deployment failed\n" + (err.reason || err.message || err), "error");
    console.error(err);
  } finally {
    deployBtn.disabled = false;
  }
};
</script>
</body>
</html>
